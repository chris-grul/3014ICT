#!/usr/sbin/nft -f

flush ruleset

# ─── Filter table (inet = dual-stack IPv4 + IPv6) ───────────────────────────
table inet filter {

    chain input {
        type filter hook input priority 0;
        policy drop;

        # Always allow loopback traffic
        iif lo accept

        # Allow return traffic for established/related connections
        ct state established,related accept

        # Admin SSH (management) — keep the gateway reachable under the default-drop
        # policy. Sources: remote admin ranges + the HyperV host subnet on eth0.
        # (Confirm these match your environment — a wrong range here means no new
        #  SSH after a reboot; console access is the fallback.)
        tcp dport 22 ip  saddr { 49.255.230.48/29, 172.16.10.0/24 } ct state new accept
        tcp dport 22 ip6 saddr 2402:7800:2014::/48 ct state new accept

        # ICMPv6 — REQUIRED for working IPv6: neighbour discovery (ND), path-MTU
        # discovery (packet-too-big) and diagnostics (echo). No IPv4 analogue.
        ip6 nexthdr icmpv6 icmpv6 type { \
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem, \
            echo-request, echo-reply, \
            nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # Allow DNS replies arriving back on eth0 (upstream resolver responses)
        iif "eth0" udp sport 53 accept
        iif "eth0" tcp sport 53 accept
    }

    chain output {
        type filter hook output priority 0;
        policy drop;

        # Always allow loopback output
        oif lo accept

        # Allow established/related return traffic
        ct state established,related accept

        # Allow new outbound connections (curl, apt, DNS, WireGuard, etc.)
        ct state new accept

        # Allow DNS queries leaving eth0 to upstream resolvers
        oif "eth0" udp dport 53 accept
        oif "eth0" tcp dport 53 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Allow established/related traffic in both directions
        ct state established,related accept

        # Allow outbound traffic from DMZ to internet
        #   IPv4 leaves via eth0; IPv6 leaves via the wg0 tunnel (df00::/64 uplink)
        iif "eth1" oif "eth0" accept
        iif "eth1" oif "wg0"  accept

        # Forwarded ICMPv6 across the firewall (path-MTU discovery + diagnostics).
        # ND is link-local and never forwarded, so it is omitted here.
        ip6 nexthdr icmpv6 icmpv6 type { \
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem, \
            echo-request, echo-reply } accept

        # Allow inbound HTTP (port 80) — new connections to web server
        #   IPv4 arrives on eth0 (then DNAT'd, below); IPv6 arrives on the wg0
        #   tunnel and is routed straight to the server's global df10::80 (no NAT).
        iif "eth0" oif "eth1" tcp dport 80  ct state new accept
        iif "wg0"  oif "eth1" tcp dport 80  ct state new accept

        # Allow inbound HTTPS (port 443) — new connections to web server
        iif "eth0" oif "eth1" tcp dport 443 ct state new accept
        iif "wg0"  oif "eth1" tcp dport 443 ct state new accept

        # Allow inbound SMTP (port 25) — new connections to mail server
        iif "eth0" oif "eth1" tcp dport 25  ct state new accept
        iif "wg0"  oif "eth1" tcp dport 25  ct state new accept

        # Allow DNS forwarding — internal hosts querying upstream resolvers (IPv4)
        iif "eth1" oif "eth0" udp dport 53 ct state new accept
        iif "eth1" oif "eth0" tcp dport 53 ct state new accept
    }
}

# ─── NAT table (IPv4 only) ──────────────────────────────────────────────────
# IPv6 needs no NAT: the DMZ server has a real global address (2404:9400:29c1:
# df10::80) reached directly over the wg0 tunnel, so there is no ip6 nat table.
table ip nat {

    chain prerouting {
        type nat hook prerouting priority -100;
        policy accept;

        # DNAT: redirect inbound HTTP to web server
        iif "eth0" tcp dport 80  dnat to 192.168.1.80

        # DNAT: redirect inbound HTTPS to web server
        iif "eth0" tcp dport 443 dnat to 192.168.1.80

        # DNAT: redirect inbound SMTP to mail server
        iif "eth0" tcp dport 25  dnat to 192.168.1.80
    }

    chain postrouting {
        type nat hook postrouting priority 100;
        policy accept;

        # Masquerade all outbound traffic leaving eth0 (provides internet NAT)
        oif "eth0" masquerade

        # SNAT: web server return traffic — rewrite source to firewall's eth1 IP
        # so replies are routed back through the firewall, not sent directly
        oif "eth1" tcp dport 80  ip daddr 192.168.1.80 snat to 192.168.1.254

        # SNAT: HTTPS return traffic
        oif "eth1" tcp dport 443 ip daddr 192.168.1.80 snat to 192.168.1.254

        # SNAT: SMTP return traffic
        oif "eth1" tcp dport 25  ip daddr 192.168.1.80 snat to 192.168.1.254
    }
}
