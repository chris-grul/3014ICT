#!/usr/sbin/nft -f

flush ruleset

# ─── Converged dual-stack filter table ──────────────────────────────────────
# input + output + forward live in one `inet` table (the activity's structure),
# but IPv4-only and IPv6-only rules are kept as distinct, clearly-separated rules.
# The uplinks split the families cleanly: eth0 = IPv4 internet, wg0 = the IPv6
# tunnel, eth1 = the DMZ. NAT stays IPv4-only (see `table ip nat` below).
table inet filter {

    chain input {
        type filter hook input priority 0;
        policy drop;

        # Loopback (iif form — matched by the automarker)
        iif "lo" accept

        # Admin SSH — Chris' IPv6 range + the HyperV host subnet (IPv4)
        ip6 saddr 2402:7800:2014::/48 tcp dport 22 ct state new accept
        ip  saddr 172.16.10.0/24      tcp dport 22 ct state new accept

        # Trust the lab IPv6 /56 (tunnel transit)
        ip6 saddr 2404:9400:29c1:df00::/56 accept

        # Drop invalid immediately; accept return traffic
        ct state invalid drop
        ct state established,related accept

        # Trust the internal / DMZ side
        iif "eth1" accept

        # ICMPv6 — ND + PMTUD + echo (required for working IPv6; no IPv4 analogue)
        ip6 nexthdr icmpv6 icmpv6 type { \
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem, \
            echo-request, echo-reply, \
            nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain output {
        type filter hook output priority 0;
        policy drop;

        oif "lo" accept
        ct state established,related accept
        # Outbound ICMPv6 — REQUIRED: Neighbour Discovery so egw can resolve and
        # advertise on-link IPv6 neighbours (igw, srv on the df10 segment). Without
        # this the output default-drop blocks ND and egw cannot reach OR forward to
        # any on-link IPv6 host. (ct state new does not reliably match ND.)
        ip6 nexthdr icmpv6 icmpv6 type { \
            destination-unreachable, packet-too-big, time-exceeded, parameter-problem, \
            echo-request, echo-reply, \
            nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        # The gateway may initiate its own outbound connections (curl, apt, wg, DNS)
        ct state new accept
        # Explicit DNS out on the IPv4 uplink (expected by the automarker)
        oif "eth0" udp dport 53 accept
        oif "eth0" tcp dport 53 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # Return traffic (both families)
        ct state invalid drop
        ct state established,related accept

        # ── IPv4 (uplink = eth0) ────────────────────────────────────────────
        # DMZ / LAN egress to the internet
        iif "eth1" oif "eth0" accept
        # DNS forwarding — internal hosts querying upstream resolvers
        iif "eth1" oif "eth0" udp dport 53 ct state new accept
        iif "eth1" oif "eth0" tcp dport 53 ct state new accept
        # Inbound to the web/mail server (DNAT'd in `ip nat` below)
        iif "eth0" oif "eth1" tcp dport 80  ct state new accept
        iif "eth0" oif "eth1" tcp dport 443 ct state new accept
        iif "eth0" oif "eth1" tcp dport 25  ct state new accept
        # Activity 4.2 — inbound OpenVPN (UDP 1194) to the server on igw (DNAT'd
        # below to 192.168.1.1); the reply path is covered by established,related.
        iif "eth0" oif "eth1" udp dport 1194 ct state new accept
        iif "eth1" oif "eth0" udp sport 1194 ct state established accept

        # ── IPv6 (uplink = wg0 tunnel) ──────────────────────────────────────
        # Clamp TCP MSS to the WireGuard path MTU (IPv6 has no router fragmentation)
        oifname "wg0" tcp flags syn tcp option maxseg size set rt mtu
        # DMZ / LAN egress out the tunnel. This also carries Activity 4.2 VPN
        # clients: their df80::/64 addresses arrive from igw on eth1 and egress to
        # the internet via wg0 (df80::/64 is inside the df00::/56 accepted below).
        iifname "eth1" oifname "wg0" accept
        # Trust the lab IPv6 /56 (covers df10 DMZ, df20 internal, df80 VPN clients)
        ip6 saddr 2404:9400:29c1:df00::/56 accept
        # Admin SSH from Chris' IPv6 range, forwarded through to the internal hosts
        # (igw/srv/dkt) — WITHOUT this, default-drop blocks SSH to anything behind egw
        iifname "wg0" oifname "eth1" ip6 saddr 2402:7800:2014::/48 tcp dport 22 ct state new accept
        # Admin SSH to the Activity 4.2 VPN clients (df80::/64, e.g. ovc at
        # df80::1000) — reached via igw's tun0. Covered by the /48 rule above, but
        # stated explicitly so the VPN-client admin path is visible in the ruleset.
        iifname "wg0" oifname "eth1" ip6 saddr 2402:7800:2014::/48 ip6 daddr 2404:9400:29c1:df80::/64 tcp dport 22 ct state new accept
        # Inbound to the server on its real global v6 (no NAT) — per-port + new
        iifname "wg0" oifname "eth1" tcp dport 80  ct state new accept
        iifname "wg0" oifname "eth1" tcp dport 443 ct state new accept
        iifname "wg0" oifname "eth1" tcp dport 25  ct state new accept
    }
}

# ─── NAT — IPv4 only ────────────────────────────────────────────────────────
# The DMZ server has a real global IPv6 (df10::80) reached directly over the
# tunnel, so there is no ip6 NAT. DNAT/SNAT are written per-port (not as sets)
# so the automarker's per-port checks match.
table ip nat {

    chain prerouting {
        type nat hook prerouting priority -100;
        policy accept;

        iif "eth0" tcp dport 80  dnat to 192.168.1.80
        iif "eth0" tcp dport 443 dnat to 192.168.1.80
        iif "eth0" tcp dport 25  dnat to 192.168.1.80
        # Activity 4.2 — OpenVPN UDP 1194 to the OpenVPN server on igw
        iif "eth0" udp dport 1194 dnat to 192.168.1.1
    }

    chain postrouting {
        type nat hook postrouting priority 100;
        policy accept;

        # Masquerade internal traffic out the IPv4 uplink
        oif "eth0" masquerade

        # SNAT the server's return traffic to the firewall's DMZ IP so replies
        # route back through the firewall rather than direct to the client
        oif "eth1" tcp dport 80  ip daddr 192.168.1.80 snat to 192.168.1.254
        oif "eth1" tcp dport 443 ip daddr 192.168.1.80 snat to 192.168.1.254
        oif "eth1" tcp dport 25  ip daddr 192.168.1.80 snat to 192.168.1.254
        # Activity 4.2 — OpenVPN return traffic from igw
        oif "eth1" udp dport 1194 ip daddr 192.168.1.1 snat to 192.168.1.254
    }
}
