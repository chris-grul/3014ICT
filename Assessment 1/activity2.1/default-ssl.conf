<VirtualHost *:443>
  ServerAdmin admin@chrisgrul-3014ICT.com
  ServerName chrisgrul-3014ICT.com
  ServerAlias www.chrisgrul-3014ICT.com *.chrisgrul-3014ICT.com 192.168.1.80 [2404:9400:29c1:df10::80]
  DocumentRoot /var/www/html
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
  SSLEngine on
  SSLCertificateFile /etc/ssl/certs/chrisgrul-3014ICT.crt
  SSLCertificateKeyFile /etc/ssl/private/chrisgrul-3014ICT.key
  <FilesMatch "\.(cgi|shtml|phtml|php)$">
    SSLOptions +StdEnvVars
  </FilesMatch>
  <Directory /usr/lib/cgi-bin>
    SSLOptions +StdEnvVars
  </Directory>
</VirtualHost>
