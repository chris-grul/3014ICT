# ==============================================================================
# Squid — Internal Gateway (igw)  |  3014ICT Assessment 1
# As-built config (Secure Web / Proxy activity) — effective directives only
# (stock Ubuntu comments stripped). Full file lives at /etc/squid/squid.conf.
#
# Roles:
#   - Explicit forward proxy      : http_port 8080
#   - Transparent interception    : http_port 8081 intercept  (igw nftables
#                                    redirects internal :80 here)
#   - HTTPS intercept + ssl-bump  : https_port 8443 intercept ssl-bump
#                                    (peek at step1, then bump); igw nftables
#                                    redirects internal :443 here
#   - Sample policy               : deny Australian (.au) sites during office
#                                    hours (Mon-Fri 09:00-17:00); allow the
#                                    internal LAN (10.10.1.0/24 + df20::/64)
#
# The ssl-bump CA private key is NOT in the repo. On the box:
#   /etc/squid/ssl_cert/squid-bump-ca.key  (chain squid-bump-ca-chain.crt)
# ==============================================================================

acl localnet src fe80::/10		# RFC 4291 link-local (directly plugged) machines#
acl SSL_ports port 443
acl Safe_ports port 80		# http
acl Safe_ports port 443		# https
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localhost
http_access deny to_localhost
http_access deny to_linklocal
include /etc/squid/conf.d/*.conf
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump all
# When bumping, Squid opens its OWN TLS connection to each origin and verifies
# that server's certificate. The DMZ web server's cert is issued by our private
# (EasyRSA) root CA, which Squid does not trust by default -> 503
# (X-Squid-Error: ERR_SECURE_CONNECT_FAIL). Fix: trust our root CA for OUTGOING
# verification. default-ca is ON by default, so cafile ADDS our CA on top of the
# system trust store -> public HTTPS still verifies normally AND our internal
# server verifies too (verification stays ON, unlike DONT_VERIFY_PEER).
#
# The EasyRSA ROOT CA (public cert, CN=chrisgrul) ships in this repo as
# activity2.1/lab-ca.crt. Copy it to igw and make it world-readable:
#   sudo install -m 444 lab-ca.crt /etc/squid/ssl_cert/lab-ca.crt
# The server cert must also carry a SAN matching whatever Squid connects to
# (the SNI hostname, e.g. www.chrisgrul-3014ict.com, or the IP if requested by IP).
tls_outgoing_options cafile=/etc/squid/ssl_cert/lab-ca.crt
# Quick lab fallback (disables upstream verification entirely — less secure):
#   tls_outgoing_options flags=DONT_VERIFY_PEER
acl internal_network src 10.10.1.0/24
acl localnet src 2404:9400:29c1:df20::/64
acl australian_sites dstdomain .au .com.au .edu.au .gov.au .net.au .org.au
acl office_hours time MTWHF 09:00-17:00
http_access deny australian_sites office_hours
http_access allow internal_network
http_access allow all
http_access deny all
http_access deny all
http_port 8080
http_port 8081 intercept
https_port 8443 intercept ssl-bump \
    tls-cert=/etc/squid/ssl_cert/squid-bump-ca-chain.crt \
    tls-key=/etc/squid/ssl_cert/squid-bump-ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
sslcrtd_children 32 startup=5 idle=1
coredump_dir /var/spool/squid
refresh_pattern ^ftp:		1440	20%	10080
refresh_pattern -i (/cgi-bin/|\?) 0	0%	0
refresh_pattern \/(Packages|Sources)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
refresh_pattern \/Release(|\.gpg)$ 0 0% 0 refresh-ims
refresh_pattern \/InRelease$ 0 0% 0 refresh-ims
refresh_pattern \/(Translation-.*)(|\.bz2|\.gz|\.xz)$ 0 0% 0 refresh-ims
refresh_pattern .		0	20%	4320
