# ==============================================================================
# OpenVPN server — Internal Gateway (igw)  |  3014ICT Assessment 1, Activity 4.2
# Based on the activity's template server.conf, extended with an IPv6 tunnel.
#
#   IPv4 tunnel pool : 10.8.0.0/24              (server tun0 = 10.8.0.1)
#   IPv6 tunnel pool : 2404:9400:29c1:df80::/64 (server tun0 = df80::1,
#                                                clients from df80::1000)
#
# Transport is IPv4 (clients connect to the External Gateway's eth0 on UDP 1194,
# which DNATs to this server at 192.168.1.1). IPv6 is carried INSIDE the tunnel
# and pushed to clients. Certificates/keys are the EasyRSA files copied into
# /etc/openvpn during Part B.
# ==============================================================================

port 1194
proto udp
dev tun

ca ca.crt
cert server.crt
key server.key
dh dh2048.pem

# IPv4 VPN subnet — clients get addresses from this pool
server 10.8.0.0 255.255.255.0

# IPv6 VPN subnet — clients get addresses from df80::/64 (server tun0 = df80::1)
server-ipv6 2404:9400:29c1:df80::/64

# Push routes so clients can reach the internal DMZ network on both stacks
push "route 192.168.1.0 255.255.255.0"
push "route-ipv6 2404:9400:29c1:df10::/64"

# Redirect all client traffic through the VPN gateway — both IPv4 and IPv6
push "redirect-gateway def1 ipv6 bypass-dhcp"

# Push DNS resolvers to clients (BIND on the Internal Gateway)
push "dhcp-option DNS 10.10.1.254"
push "dhcp-option DNS 2404:9400:29c1:df10::1"

# Keep-alive settings
keepalive 10 120

# TLS authentication key (direction 0 = server; clients use direction 1)
tls-auth ta.key 0

cipher AES-256-CBC
user nobody
group nogroup
persist-key
persist-tun

status /var/log/openvpn/openvpn-status.log
log /var/log/openvpn/openvpn.log
verb 3
