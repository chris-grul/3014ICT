network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: true
      dhcp6: yes
      accept-ra: true
    eth1:
      dhcp4: no
      dhcp6: no
      accept-ra: no
      addresses: [192.168.1.254/24, "2404:9400:29c1:df10::254/64"]
      routes:
        - to: 10.10.1.0/24
          via: 192.168.1.1
        - to: "2404:9400:29c1:df20::/64"
          via: "2404:9400:29c1:df10::1"
